name: LYNK TV builds

# Builds the Mac app (Apple Silicon + Intel) and the LG webOS TV package.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.25.0-lynk.1
# to also publish a GitHub Release with the files attached.
on:
    workflow_dispatch:
    push:
        tags: ['v*']

permissions:
    contents: write

jobs:
    mac:
        name: Mac (${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: arm64
                      runner: macos-latest
                    - arch: x64
                      runner: macos-15-intel
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build only this architecture
              run: |
                  node -e "
                  const fs=require('fs');const c=JSON.parse(fs.readFileSync('electron-builder.json','utf8'));
                  for (const t of c.mac.target) t.arch=['${{ matrix.arch }}'];
                  fs.writeFileSync('electron-builder.json', JSON.stringify(c,null,4));"
            - name: Make the app (unsigned)
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
                  IPTVNATOR_REQUIRE_EMBEDDED_MPV: '0'
                  NX_NO_CLOUD: 'true'
              run: pnpm run make:app -- --publishPolicy=never
            - uses: actions/upload-artifact@v4
              with:
                  name: lynk-tv-mac-${{ matrix.arch }}
                  path: |
                      dist/executables/*.dmg
                      dist/executables/*.zip
                  if-no-files-found: error

    tv:
        name: LG webOS TV
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm nx run tv:package
              env:
                  NX_NO_CLOUD: 'true'
            - uses: actions/upload-artifact@v4
              with:
                  name: lynk-tv-webos
                  path: dist/tv-package/*.ipk
                  if-no-files-found: error

    release:
        name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [mac, tv]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: out
                  merge-multiple: true
            - uses: softprops/action-gh-release@v2
              with:
                  files: out/*
