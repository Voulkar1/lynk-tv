name: LYNK TV builds

# Builds the Mac app (Apple Silicon + Intel) and the LG webOS TV package.
# Runs on every push to main (or from the Actions tab: "Run workflow") and
# publishes a GitHub Release with the installers attached.
on:
    workflow_dispatch:
    push:
        branches: [main]

permissions:
    contents: write

jobs:
    mac:
        name: Mac (${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: arm64
                      runner: macos-latest
                    - arch: x64
                      runner: macos-15-intel
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build only this architecture
              run: |
                  node -e "
                  const fs=require('fs');const c=JSON.parse(fs.readFileSync('electron-builder.json','utf8'));
                  for (const t of c.mac.target) t.arch=['${{ matrix.arch }}'];
                  fs.writeFileSync('electron-builder.json', JSON.stringify(c,null,4));"
            - name: Make the app (unsigned)
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
                  IPTVNATOR_REQUIRE_EMBEDDED_MPV: '0'
                  NX_NO_CLOUD: 'true'
              run: pnpm run make:app -- --publishPolicy=never
            - name: Check the app signature (ad-hoc)
              run: |
                  APP=$(find dist/executables -maxdepth 2 -name "*.app" | head -1)
                  echo "Checking $APP"
                  codesign --verify --deep --strict --verbose=2 "$APP"
                  codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier"
            - uses: actions/upload-artifact@v4
              with:
                  name: lynk-tv-mac-${{ matrix.arch }}
                  path: |
                      dist/executables/*.dmg
                      dist/executables/*.zip
                  if-no-files-found: error

    tv:
        name: LG webOS TV
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm nx run tv:package
              env:
                  NX_NO_CLOUD: 'true'
            - uses: actions/upload-artifact@v4
              with:
                  name: lynk-tv-webos
                  path: dist/tv-package/*.ipk
                  if-no-files-found: error

    release:
        name: GitHub Release
        needs: [mac, tv]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: out
                  merge-multiple: true
            - uses: softprops/action-gh-release@v2
              with:
                  tag_name: lynk-build-${{ github.run_number }}
                  target_commitish: ${{ github.sha }}
                  name: LYNK TV (build ${{ github.run_number }})
                  body: "Mac (Apple Silicon = arm64, Intel = x64) and LG webOS TV builds. Unsigned Mac app - the first time, right-click it and choose Open."
                  files: out/*
